<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="vd3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B36"/>
      <stop offset="100%" stop-color="#0A3D55"/>
    </linearGradient>
    <radialGradient id="vd3-glow1" cx="70%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vd3-glow2" cx="20%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#vd3-bg)"/>
  <rect width="800" height="450" fill="url(#vd3-glow1)"/>
  <rect width="800" height="450" fill="url(#vd3-glow2)"/>

  <!-- Subtle grid -->
  <g stroke="#22D3EE" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Rear wheel -->
  <circle cx="195" cy="305" r="100" fill="none" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.25"/>
  <circle cx="195" cy="305" r="78" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.10"/>
  <circle cx="195" cy="305" r="14" fill="none" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.30"/>
  <!-- Rear spokes (4) -->
  <g stroke="#22D3EE" stroke-opacity="0.12" stroke-width="1">
    <line x1="195" y1="205" x2="195" y2="405"/>
    <line x1="95" y1="305" x2="295" y2="305"/>
    <line x1="124" y1="234" x2="266" y2="376"/>
    <line x1="266" y1="234" x2="124" y2="376"/>
  </g>

  <!-- Front wheel -->
  <circle cx="410" cy="305" r="100" fill="none" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.25"/>
  <circle cx="410" cy="305" r="78" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.10"/>
  <circle cx="410" cy="305" r="14" fill="none" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.30"/>
  <!-- Front spokes (4) -->
  <g stroke="#22D3EE" stroke-opacity="0.12" stroke-width="1">
    <line x1="410" y1="205" x2="410" y2="405"/>
    <line x1="310" y1="305" x2="510" y2="305"/>
    <line x1="339" y1="234" x2="481" y2="376"/>
    <line x1="481" y1="234" x2="339" y2="376"/>
  </g>

  <!-- Bike frame (simplified diamond) -->
  <g stroke="#22D3EE" stroke-opacity="0.55" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Chain stay: rear axle to BB -->
    <line x1="195" y1="305" x2="300" y2="305"/>
    <!-- Seat tube: BB to seat post top -->
    <line x1="300" y1="305" x2="285" y2="195"/>
    <!-- Top tube: seat post to head tube -->
    <line x1="285" y1="195" x2="390" y2="200"/>
    <!-- Down tube: head tube to BB -->
    <line x1="390" y1="200" x2="300" y2="305"/>
    <!-- Seat stay: rear axle to seat post top -->
    <line x1="285" y1="195" x2="195" y2="305"/>
    <!-- Fork: head tube to front axle -->
    <line x1="390" y1="200" x2="410" y2="305"/>
  </g>

  <!-- Seat post and saddle -->
  <g stroke="#22D3EE" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
    <line x1="285" y1="195" x2="278" y2="178"/>
    <line x1="265" y1="175" x2="298" y2="175"/>
  </g>

  <!-- Handlebar and stem -->
  <g stroke="#22D3EE" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
    <line x1="390" y1="200" x2="390" y2="183"/>
    <line x1="375" y1="183" x2="410" y2="183"/>
  </g>

  <!-- Battery pack (mid-frame decoration) -->
  <rect x="316" y="232" width="30" height="14" rx="3" fill="rgba(34,211,238,0.15)" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="318" y="234" width="22" height="10" rx="2" fill="rgba(34,211,238,0.35)"/>

  <!-- Notch bar at top -->
  <rect x="397" y="0" width="5" height="30" fill="#22D3EE" rx="0 0 2 2" opacity="0.65"/>

  <!-- Vertical separator -->
  <line x1="500" y1="50" x2="500" y2="400" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Right panel: Category chip -->
  <rect x="520" y="88" width="68" height="20" rx="10" fill="rgba(34,211,238,0.12)" stroke="rgba(34,211,238,0.30)" stroke-width="1"/>
  <text x="554" y="102" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#22D3EE" text-anchor="middle" letter-spacing="1.5">E-BIKES</text>

  <!-- Brand name -->
  <text x="520" y="143" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.38)" letter-spacing="2.5">VELOTRIC</text>

  <!-- Product name -->
  <text x="520" y="184" font-family="system-ui,sans-serif" font-size="32" font-weight="800" fill="white" letter-spacing="-0.5">Discover 3</text>

  <!-- Divider -->
  <line x1="520" y1="202" x2="775" y2="202" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Score label -->
  <text x="520" y="228" font-family="system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.30)" letter-spacing="1">PICKNOTCH SCORE</text>

  <!-- Score number -->
  <text x="520" y="282" font-family="system-ui,sans-serif" font-size="60" font-weight="800" fill="#22D3EE" letter-spacing="-2">8.5</text>
  <text x="596" y="272" font-family="system-ui,sans-serif" font-size="22" fill="rgba(255,255,255,0.22)">/10</text>

  <!-- Divider -->
  <line x1="520" y1="300" x2="775" y2="300" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Best for -->
  <text x="520" y="326" font-family="system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.28)" letter-spacing="1">BEST FOR</text>
  <text x="520" y="350" font-family="system-ui,sans-serif" font-size="14" fill="rgba(255,255,255,0.68)">Comfort-first commuters</text>

  <!-- Key specs -->
  <text x="520" y="380" font-family="system-ui,sans-serif" font-size="12" fill="rgba(255,255,255,0.32)">750W · 80mi range · Hydraulic brakes</text>

  <!-- Watermark -->
  <text x="520" y="420" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="rgba(255,255,255,0.12)" letter-spacing="1.5">PICKNOTCH.COM</text>
</svg>
