<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="Velotric Discover 3 illustration">
  <defs>
    <linearGradient id="vd3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B36"/>
      <stop offset="55%" stop-color="#0A2E47"/>
      <stop offset="100%" stop-color="#0A3D55"/>
    </linearGradient>
    <radialGradient id="vd3-glow1" cx="72%" cy="26%" r="58%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vd3-glow2" cx="22%" cy="82%" r="46%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vd3-podium" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vd3-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5CE6F7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="500" fill="url(#vd3-bg)"/>
  <rect width="1000" height="500" fill="url(#vd3-glow1)"/>
  <rect width="1000" height="500" fill="url(#vd3-glow2)"/>

  <!-- Faint grid -->
  <g stroke="#22D3EE" stroke-opacity="0.045" stroke-width="1">
    <line x1="0" y1="100" x2="1000" y2="100"/>
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="0" y1="300" x2="1000" y2="300"/>
    <line x1="0" y1="400" x2="1000" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="500"/>
  </g>

  <!-- Notch brand mark: a clean bar dropping from top center -->
  <path d="M496 0 h8 v30 a4 4 0 0 1 -4 4 a4 4 0 0 1 -4 -4 z" fill="#22D3EE" opacity="0.7"/>
  <rect x="496" y="0" width="8" height="13" fill="#5CE6F7" opacity="0.9"/>

  <!-- Soft podium glow under the bike -->
  <ellipse cx="500" cy="340" rx="360" ry="150" fill="url(#vd3-podium)"/>
  <ellipse cx="500" cy="430" rx="250" ry="26" fill="#22D3EE" fill-opacity="0.05"/>

  <!-- ===== E-bike line illustration (centered, crop-safe) ===== -->
  <!-- Rear wheel -->
  <circle cx="360" cy="330" r="92" fill="none" stroke="url(#vd3-stroke)" stroke-width="2.5" stroke-opacity="0.55"/>
  <circle cx="360" cy="330" r="70" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.14"/>
  <circle cx="360" cy="330" r="15" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-opacity="0.5"/>
  <circle cx="360" cy="330" r="6" fill="#22D3EE" fill-opacity="0.35"/>
  <g stroke="#22D3EE" stroke-opacity="0.13" stroke-width="1">
    <line x1="360" y1="238" x2="360" y2="422"/>
    <line x1="268" y1="330" x2="452" y2="330"/>
    <line x1="295" y1="265" x2="425" y2="395"/>
    <line x1="425" y1="265" x2="295" y2="395"/>
  </g>

  <!-- Front wheel -->
  <circle cx="640" cy="330" r="92" fill="none" stroke="url(#vd3-stroke)" stroke-width="2.5" stroke-opacity="0.55"/>
  <circle cx="640" cy="330" r="70" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.14"/>
  <circle cx="640" cy="330" r="15" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-opacity="0.5"/>
  <circle cx="640" cy="330" r="6" fill="#22D3EE" fill-opacity="0.35"/>
  <g stroke="#22D3EE" stroke-opacity="0.13" stroke-width="1">
    <line x1="640" y1="238" x2="640" y2="422"/>
    <line x1="548" y1="330" x2="732" y2="330"/>
    <line x1="575" y1="265" x2="705" y2="395"/>
    <line x1="705" y1="265" x2="575" y2="395"/>
  </g>

  <!-- Frame -->
  <g stroke="url(#vd3-stroke)" stroke-opacity="0.85" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- chain stay: rear hub -> bottom bracket -->
    <line x1="360" y1="330" x2="500" y2="330"/>
    <!-- seat tube -->
    <line x1="500" y1="330" x2="468" y2="205"/>
    <!-- top tube -->
    <line x1="468" y1="205" x2="610" y2="212"/>
    <!-- down tube -->
    <line x1="610" y1="212" x2="500" y2="330"/>
    <!-- seat stay -->
    <line x1="468" y1="205" x2="360" y2="330"/>
    <!-- fork -->
    <line x1="610" y1="212" x2="640" y2="330"/>
  </g>

  <!-- Seat post + saddle -->
  <g stroke="url(#vd3-stroke)" stroke-opacity="0.8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="468" y1="205" x2="458" y2="180"/>
    <path d="M432 178 Q450 170 484 176" />
  </g>

  <!-- Stem + handlebar -->
  <g stroke="url(#vd3-stroke)" stroke-opacity="0.8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="610" y1="212" x2="612" y2="185"/>
    <path d="M596 180 Q620 178 640 188" />
  </g>

  <!-- Crank -->
  <circle cx="500" cy="330" r="20" fill="none" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.45"/>
  <line x1="500" y1="330" x2="512" y2="356" stroke="#22D3EE" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>

  <!-- Integrated battery (down tube) -->
  <rect x="516" y="252" width="64" height="20" rx="5" transform="rotate(-47 548 262)"
        fill="rgba(34,211,238,0.16)" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Front light -->
  <circle cx="636" cy="196" r="5" fill="#22D3EE" fill-opacity="0.5"/>
</svg>
